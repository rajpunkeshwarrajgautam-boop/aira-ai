name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "DEPLOY" to confirm execution against Production database'
        required: true
        type: string
      target_git_sha:
        description: 'Exact certified Git commit SHA on refs/heads/main to execute'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  production-migrate:
    name: Execute Production Migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Validate Execution Context, Branch, and SHA Binding
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production migrations can only be dispatched from refs/heads/main. Current ref: ${{ github.ref }}"
            exit 1
          fi

          if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "::error::Execution confirmation string mismatch. Must be 'DEPLOY'."
            exit 1
          fi

          if [ "${{ github.event.inputs.target_git_sha }}" != "${{ github.sha }}" ]; then
            echo "::error::Provided target_git_sha (${{ github.event.inputs.target_git_sha }}) does not match current main commit SHA (${{ github.sha }}). Refusing arbitrary execution."
            exit 1
          fi

          echo "Execution validated: Dispatched on refs/heads/main at certified SHA ${{ github.sha }}."

      - name: Check out certified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Migration Preflight
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/db/migration-preflight.mjs

      - name: Execute Prisma Migrate Deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Run Migration Postflight
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node scripts/db/migration-postflight.mjs

      - name: Upload Migration Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-evidence-${{ github.sha }}
          path: migration-postflight-evidence.json
          if-no-files-found: warn

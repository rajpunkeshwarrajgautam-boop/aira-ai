name: PostgreSQL Migration Chain

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aira_migration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aira_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aira_migration_ci?schema=public
      PSQL_URL: postgresql://postgres:postgres@127.0.0.1:5432/aira_migration_ci
      PGPASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for relevant migration file changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          if echo "$CHANGED_FILES" | grep -qE '^(prisma/|prisma\.config\.ts|package\.json|pnpm-lock\.yaml|\.github/workflows/migration-chain\.yml|perplexity-clone/my-turborepo/apps/web/lib/agent-platform/recovery\.ts|perplexity-clone/my-turborepo/apps/web/lib/agent-platform/orchestrator\.ts|perplexity-clone/my-turborepo/apps/web/lib/autogpt/|perplexity-clone/my-turborepo/apps/web/test/agent-platform-recovery-real-db)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No database migration files changed. Skipping migration chain execution."
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        if: steps.changes.outputs.should_run == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        if: steps.changes.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Assert disposable database starts without application tables
        if: steps.changes.outputs.should_run == 'true'
        run: |
          table_count="$(psql "$PSQL_URL" -Atc "select count(*) from pg_tables where schemaname = 'public';")"
          test "$table_count" = "0" || {
            echo "::error::Disposable database unexpectedly contains $table_count public table(s)."
            exit 1
          }

      - name: Prepare Supabase-compatible migration principals
        if: steps.changes.outputs.should_run == 'true'
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin bypassrls;
            end if;
          end
          $$;
          SQL

      - name: Materialize the historical baseline as a CI-only first migration
        if: steps.changes.outputs.should_run == 'true'
        run: |
          test ! -e prisma/migrations/20260429_initial_schema || {
            echo "::error::The historical baseline must not be committed into prisma/migrations; existing deployments must never see it as a pending production migration."
            exit 1
          }
          mkdir prisma/migrations/20260429_initial_schema
          cp prisma/baseline/20260429_initial_schema.sql \
            prisma/migrations/20260429_initial_schema/migration.sql

      - name: Apply historical baseline and every recorded Prisma migration
        if: steps.changes.outputs.should_run == 'true'
        run: pnpm exec prisma migrate deploy

      - name: Verify migration ledger is complete
        if: steps.changes.outputs.should_run == 'true'
        run: |
          expected="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          applied="$(psql "$PSQL_URL" -Atc 'select count(*) from "_prisma_migrations" where finished_at is not null and rolled_back_at is null;')"
          if [ "$expected" != "$applied" ]; then
            echo "::error::Expected $expected applied migrations, found $applied."
            pnpm exec prisma migrate status || true
            exit 1
          fi
          pnpm exec prisma migrate status

      - name: Verify representative schema milestones
        if: steps.changes.outputs.should_run == 'true'
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            missing text[];
          begin
            select array_agg(name order by name)
              into missing
              from (values
                ('User'),
                ('ProductAnalyticsEvent'),
                ('AgentRun'),
                ('UserMemory'),
                ('UserMemoryEmbedding'),
                ('KnowledgeAsset'),
                ('MemoryEntity'),
                ('AgentProject'),
                ('AgentPlatformRun'),
                ('AgentTask'),
                ('BrowserSession')
              ) as expected(name)
             where to_regclass(format('public.%I', name)) is null;

            if missing is not null then
              raise exception 'migration chain is missing representative tables: %', missing;
            end if;
          end
          $$;
          SQL

      - name: Prove migrate deploy is restart-idempotent
        if: steps.changes.outputs.should_run == 'true'
        run: |
          before="$(psql "$PSQL_URL" -Atc 'select count(*) from "_prisma_migrations" where finished_at is not null and rolled_back_at is null;')"
          pnpm exec prisma migrate deploy
          after="$(psql "$PSQL_URL" -Atc 'select count(*) from "_prisma_migrations" where finished_at is not null and rolled_back_at is null;')"
          test "$before" = "$after" || {
            echo "::error::A second migrate deploy changed the applied migration count ($before -> $after)."
            exit 1
          }

      - name: Prove blocked recovery semantics against real PostgreSQL
        if: steps.changes.outputs.should_run == 'true'
        env:
          AIRA_REAL_DB_RECOVERY_TESTS: "1"
          DATABASE_POOL_MAX: "4"
          NODE_ENV: test
        run: |
          pnpm --filter web run precheck-types
          pnpm --filter web exec node --import ./test/resolver.mjs --test ./test/agent-platform-recovery-real-db.test.ts

      - name: Simulate an existing deployment before the additive ordering repair
        if: steps.changes.outputs.should_run == 'true'
        run: |
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 <<'SQL'
          delete from "_prisma_migrations"
           where migration_name in (
             '20260823_semantic_embedding_table_precondition',
             '20260825_semantic_embedding_exact_route_enforcement'
           );

          drop index if exists public."UserMemorySemanticEmbedding_route_idx";
          drop index if exists public."KnowledgeChunkSemanticEmbedding_route_idx";

          create index if not exists "UserMemorySemanticEmbedding_free_hnsw_idx"
            on public."UserMemorySemanticEmbedding"
            using hnsw (embedding extensions.vector_cosine_ops)
            with (m = 16, ef_construction = 64)
            where tier = 'free';
          create index if not exists "UserMemorySemanticEmbedding_pro_hnsw_idx"
            on public."UserMemorySemanticEmbedding"
            using hnsw (embedding extensions.vector_cosine_ops)
            with (m = 16, ef_construction = 64)
            where tier = 'pro';
          create index if not exists "KnowledgeChunkSemanticEmbedding_free_hnsw_idx"
            on public."KnowledgeChunkSemanticEmbedding"
            using hnsw (embedding extensions.vector_cosine_ops)
            with (m = 16, ef_construction = 64)
            where tier = 'free';
          create index if not exists "KnowledgeChunkSemanticEmbedding_pro_hnsw_idx"
            on public."KnowledgeChunkSemanticEmbedding"
            using hnsw (embedding extensions.vector_cosine_ops)
            with (m = 16, ef_construction = 64)
            where tier = 'pro';
          SQL

          missing_repair_rows="$(psql "$PSQL_URL" -Atc "select count(*) from \"_prisma_migrations\" where migration_name in ('20260823_semantic_embedding_table_precondition','20260825_semantic_embedding_exact_route_enforcement') and finished_at is not null and rolled_back_at is null;")"
          test "$missing_repair_rows" = "0" || {
            echo "::error::Existing-deployment simulation did not remove both repair ledger rows."
            exit 1
          }

      - name: Prove an existing deployment can apply the additive repair out of historical order
        if: steps.changes.outputs.should_run == 'true'
        run: |
          before="$(psql "$PSQL_URL" -Atc 'select count(*) from "_prisma_migrations" where finished_at is not null and rolled_back_at is null;')"
          pnpm exec prisma migrate deploy
          after="$(psql "$PSQL_URL" -Atc 'select count(*) from "_prisma_migrations" where finished_at is not null and rolled_back_at is null;')"
          test "$((after - before))" = "2" || {
            echo "::error::Expected exactly two additive repair migrations to apply to the simulated existing deployment ($before -> $after)."
            exit 1
          }

          repaired="$(psql "$PSQL_URL" -Atc "select count(*) from \"_prisma_migrations\" where migration_name in ('20260823_semantic_embedding_table_precondition','20260825_semantic_embedding_exact_route_enforcement') and finished_at is not null and rolled_back_at is null;")"
          test "$repaired" = "2" || {
            echo "::error::Both repair migrations were not recorded as successfully applied."
            exit 1
          }

          psql "$PSQL_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if to_regclass('public."UserMemorySemanticEmbedding_route_idx"') is null
              or to_regclass('public."KnowledgeChunkSemanticEmbedding_route_idx"') is null then
              raise exception 'exact-route indexes were not restored by the repair';
            end if;

            if to_regclass('public."UserMemorySemanticEmbedding_free_hnsw_idx"') is not null
              or to_regclass('public."UserMemorySemanticEmbedding_pro_hnsw_idx"') is not null
              or to_regclass('public."KnowledgeChunkSemanticEmbedding_free_hnsw_idx"') is not null
              or to_regclass('public."KnowledgeChunkSemanticEmbedding_pro_hnsw_idx"') is not null then
              raise exception 'tier-only HNSW indexes survived the repair';
            end if;
          end
          $$;
          SQL

      - name: Report skip summary
        if: steps.changes.outputs.should_run != 'true'
        run: echo "PostgreSQL migration chain validation skipped because no database migration files were modified in this pull request."

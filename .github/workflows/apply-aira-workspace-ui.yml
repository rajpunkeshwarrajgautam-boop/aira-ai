name: Apply Aira workspace UI

on:
  push:
    branches: [feat/aira-manus-inspired-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aira-manus-inspired-ui
      - name: Patch SearchLayout presentation only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('perplexity-clone/my-turborepo/apps/web/components/SearchLayout.tsx')
          text = path.read_text()

          text = text.replace(
              'import { UserMenu } from "./UserMenu";\n',
              'import { UserMenu } from "./UserMenu";\nimport { AiraLogo } from "./AiraLogo";\nimport { WorkspaceNav } from "./WorkspaceNav";\n',
              1,
          )
          text = text.replace(
              'import { ResearchHistoryPanel, type ResearchHistoryRow } from "./conversations/ResearchHistoryPanel";',
              'import { type ResearchHistoryRow } from "./conversations/ResearchHistoryPanel";',
              1,
          )

          old_examples = '''const EXAMPLE_QUERIES = [\n\t"Latest AI news summary",\n\t"Compare ChatGPT vs Gemini",\n\t"Best laptops under 1 lakh in India",\n] as const;'''
          new_examples = '''const EXAMPLE_QUERIES = [\n\t"Market research",\n\t"Build a plan",\n\t"Analyze data",\n\t"Write code",\n\t"Summarize documents",\n\t"Compare options",\n] as const;'''
          assert old_examples in text
          text = text.replace(old_examples, new_examples, 1)

          text = text.replace(
              '<div className={cn("relative min-h-dvh w-full overflow-hidden", className)}>',
              '<div className={cn("aira-shell relative min-h-dvh w-full overflow-hidden", className)}>',
              1,
          )
          text = text.replace(
              '<div className="relative z-10 mx-auto flex min-h-dvh max-w-7xl flex-col md:flex-row">',
              '<div className="relative z-10 flex min-h-dvh w-full flex-col md:flex-row">',
              1,
          )
          text = text.replace(
              '<div className="hidden w-[320px] shrink-0 md:block md:py-4 md:pl-4">',
              '<div className="hidden w-[288px] shrink-0 md:block">',
              1,
          )

          pattern = re.compile(r'''\n\t\t\t\t<main className="flex min-h-dvh flex-1 flex-col md:py-4 md:pr-4">[\s\S]*?\n\t\t\t\t\t<div className="mx-auto flex w-full max-w-4xl flex-1 flex-col gap-6 px-4 pb-8 md:px-8">''')
          replacement = '''
\t\t\t\t<main className="flex min-h-dvh min-w-0 flex-1 flex-col bg-white/35">
\t\t\t\t\t<header className="sticky top-0 z-30 flex h-[68px] items-center justify-between gap-3 border-b border-border-subtle bg-white/88 px-4 backdrop-blur-xl sm:px-6">
\t\t\t\t\t\t<div className="flex min-w-0 items-center gap-3">
\t\t\t\t\t\t\t{isAuthed ? (
\t\t\t\t\t\t\t\t<button
\t\t\t\t\t\t\t\t\ttype="button"
\t\t\t\t\t\t\t\t\tonClick={() => setMobileSidebarOpen(true)}
\t\t\t\t\t\t\t\t\tclassName="flex size-10 items-center justify-center rounded-xl border border-border-subtle bg-white text-content-secondary md:hidden"
\t\t\t\t\t\t\t\t\taria-label="Open conversation list"
\t\t\t\t\t\t\t\t>
\t\t\t\t\t\t\t\t\t<Menu className="size-4.5" />
\t\t\t\t\t\t\t\t</button>
\t\t\t\t\t\t\t) : null}
\t\t\t\t\t\t\t<AiraLogo className={cn(isAuthed && "md:hidden")} />
\t\t\t\t\t\t\t{isAuthed ? <WorkspaceNav className="hidden md:flex" /> : null}
\t\t\t\t\t\t</div>
\t\t\t\t\t\t<div className="flex shrink-0 items-center gap-2.5">
\t\t\t\t\t\t\t{billing && isAuthed ? (
\t\t\t\t\t\t\t\t<span className="hidden rounded-full bg-surface-inset px-3 py-1.5 text-xs text-content-secondary sm:inline">
\t\t\t\t\t\t\t\t\t<span className="font-semibold text-content-primary">{planDisplayName(billing.billingPlan)}</span>
\t\t\t\t\t\t\t\t\t<span className="mx-1 text-content-tertiary">·</span>
\t\t\t\t\t\t\t\t\t{billing.searchesRemaining} searches left
\t\t\t\t\t\t\t\t</span>
\t\t\t\t\t\t\t) : null}
\t\t\t\t\t\t\t<UserMenu />
\t\t\t\t\t\t</div>
\t\t\t\t\t</header>

\t\t\t\t\t{showConversationEmpty ? (
\t\t\t\t\t\t<div className="aira-enter mx-auto w-full max-w-5xl px-4 pb-5 pt-10 text-center sm:px-6 md:pt-16">
\t\t\t\t\t\t\t<div className="mx-auto max-w-[820px]">
\t\t\t\t\t\t\t\t<div className="mx-auto inline-flex items-center gap-2 rounded-full border border-accent/15 bg-accent/[0.045] px-3.5 py-1.5 text-xs font-medium text-accent">
\t\t\t\t\t\t\t\t\t<Sparkles className="size-3.5" aria-hidden /> Persistent memory · grounded research · agents
\t\t\t\t\t\t\t\t</div>
\t\t\t\t\t\t\t\t<h1 className="aira-display mt-7 text-[40px] leading-[1.05] text-content-primary sm:text-[52px] md:text-[60px]">
\t\t\t\t\t\t\t\t\tWhat can Aira help you discover?
\t\t\t\t\t\t\t\t</h1>
\t\t\t\t\t\t\t\t<p className="mx-auto mt-4 max-w-2xl text-sm leading-6 text-content-tertiary sm:text-base">
\t\t\t\t\t\t\t\t\tAsk a question, assign research, or work through a complex decision.
\t\t\t\t\t\t\t\t</p>
\t\t\t\t\t\t\t</div>
\t\t\t\t\t\t</div>
\t\t\t\t\t) : (
\t\t\t\t\t\t<div className="mx-auto w-full max-w-5xl px-4 pb-2 pt-5 sm:px-6">
\t\t\t\t\t\t\t<p className="truncate text-sm font-semibold text-content-primary">{selectedConversationTitle ?? "Research"}</p>
\t\t\t\t\t\t\t<p className="mt-0.5 text-xs text-content-tertiary">{showAssistantSkeleton ? statusText : "Grounded conversation with saved context"}</p>
\t\t\t\t\t\t</div>
\t\t\t\t\t)}

\t\t\t\t\t<div className="mx-auto flex w-full max-w-5xl flex-1 flex-col gap-5 px-4 pb-8 sm:px-6">'''
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, count

          history_pattern = re.compile(r'''\n\t\t\t\t\t\t\{isAuthed && showConversationEmpty \? \([\s\S]*?<ResearchHistoryPanel[\s\S]*?\) : null\}\n''')
          text, count = history_pattern.subn('\n', text, count=1)
          assert count == 1, count

          text = text.replace(
              '"flex min-h-0 flex-1 flex-col overflow-hidden rounded-3xl border border-border-subtle/80 bg-surface-elevated/45 shadow-glass backdrop-blur-sm md:bg-surface-elevated/40 md:backdrop-blur-xl",',
              '"flex min-h-0 flex-1 flex-col overflow-hidden",',
              1,
          )
          text = text.replace(
              'showConversationEmpty ? "order-4 md:order-none" : "order-1 md:order-none"',
              'showConversationEmpty ? "order-4 rounded-none bg-transparent" : "order-1 rounded-3xl border border-border-subtle bg-white px-2 py-2 shadow-sm"',
              1,
          )
          text = text.replace('"flex w-full overflow-hidden rounded-3xl border border-border-subtle/80 bg-surface-elevated/85 shadow-panel backdrop-blur-sm ring-1 ring-white/40 sm:max-w-[200px] md:backdrop-blur-md",', '"flex w-full overflow-hidden rounded-full border border-border-subtle bg-white sm:max-w-[190px]",', 1)
          text = text.replace('"flex w-full overflow-hidden rounded-3xl border border-border-subtle/80 bg-surface-elevated/85 shadow-panel backdrop-blur-sm ring-1 ring-white/40 sm:max-w-[320px] md:backdrop-blur-md",', '"flex w-full overflow-hidden rounded-full border border-border-subtle bg-white sm:max-w-[300px]",', 1)

          path.write_text(text)
      - name: Commit UI patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-aira-workspace-ui.yml
          git add perplexity-clone/my-turborepo/apps/web/components/SearchLayout.tsx
          git commit -m "Apply simplified AiraAI workspace shell"
          git push origin HEAD:feat/aira-manus-inspired-ui

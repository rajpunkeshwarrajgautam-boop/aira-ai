name: Deepmerge lock probe

on:
  pull_request:
    branches:
      - feature/omniroute-gateway

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Keep lockfile delta narrowly scoped
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pnpm-lock.yaml")
          text = path.read_text()
          text = text.replace("    deprecated: Potential CWE-502 - Update to 1.3.1 or higher\n", "")
          text = text.replace("    deprecated: This version is no longer supported. Please see https://eslint.org/version-support for other options.\n", "")
          path.write_text(text)
          PY

      - name: Verify production audit without exception
        run: pnpm audit --prod

      - name: Commit exact lockfile delta
        shell: bash
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches the patched override."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: keep deepmerge lock delta minimal"
          git push origin HEAD:${{ github.head_ref }}

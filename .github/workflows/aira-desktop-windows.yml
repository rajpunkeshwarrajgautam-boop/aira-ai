name: AIRA Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop-agent/**"
      - ".github/workflows/aira-desktop-windows.yml"
  push:
    branches:
      - main
      - agent/aira-desktop-agent
    tags:
      - "aira-desktop-v*"
    paths:
      - "desktop-agent/**"
      - ".github/workflows/aira-desktop-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: desktop-agent

    env:
      CSC_LINK: ${{ secrets.AIRA_WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.AIRA_WINDOWS_CSC_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-agent/package.json

      - name: Install dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck, policy tests, and build
        run: npm run build

      - name: Package Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/aira-desktop-v') }}
        run: npx electron-builder --win nsis --publish never

      - name: Require signing credentials for tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/aira-desktop-v') }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw "AIRA_WINDOWS_CSC_LINK is required for a tagged Windows release."
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "AIRA_WINDOWS_CSC_PASSWORD is required for a tagged Windows release."
          }

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "aira-desktop-v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $($package.version). Expected $expectedTag."
          }

      - name: Package signed tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/aira-desktop-v') }}
        run: npx electron-builder --win nsis --publish never

      - name: Verify tagged installer Authenticode signature
        if: ${{ startsWith(github.ref, 'refs/tags/aira-desktop-v') }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist -Filter "*.exe" -File)
          if ($installers.Count -eq 0) {
            throw "No Windows installer executable was produced."
          }

          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
              throw "Installer signature is not valid: $($installer.Name) ($($signature.Status))."
            }
            Write-Host "Valid Authenticode signature: $($installer.Name) — $($signature.SignerCertificate.Subject)"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: aira-desktop-windows-${{ github.sha }}
          path: desktop-agent/dist/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish explicitly tagged Windows release
        if: ${{ startsWith(github.ref, 'refs/tags/aira-desktop-v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Refusing to overwrite an existing production release."
          }

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $notesPath = Join-Path $env:RUNNER_TEMP "aira-desktop-release-notes.md"
          @"
          AIRA Desktop $($package.version)

          This Windows release was produced by the owner-triggered tagged release workflow and passed dependency audit, TypeScript checks, policy/security tests, application build, packaging, and Authenticode verification before publication.
          "@ | Set-Content -Path $notesPath -Encoding utf8

          $assets = Get-ChildItem -Path dist -File | Where-Object {
            $_.Name -eq "latest.yml" -or $_.Extension -in ".exe", ".blockmap"
          } | Select-Object -ExpandProperty FullName
          if (-not $assets) {
            throw "No Windows release assets were produced."
          }

          gh release create $tag `
            --target $env:GITHUB_SHA `
            --title "AIRA Desktop $($package.version)" `
            --notes-file $notesPath `
            $assets

name: OmniRoute Operator Contracts

on:
  pull_request:
    paths:
      - "infra/omniroute/**"
      - ".github/workflows/omniroute-fly-contract.yml"
  push:
    branches:
      - main
    paths:
      - "infra/omniroute/**"
      - ".github/workflows/omniroute-fly-contract.yml"

permissions:
  contents: read

jobs:
  validate-powershell:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse operator scripts with Windows PowerShell 5.1 AST
        shell: powershell
        run: |
          $failed = $false
          $scripts = Get-ChildItem "infra/omniroute" -Filter "*.ps1" -File -Recurse
          if (-not $scripts) {
            Write-Error "No OmniRoute PowerShell operator scripts were found."
            exit 1
          }

          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($script.Name): $($_.Message)" }
            }
            else {
              Write-Host "Windows PowerShell syntax valid: $($script.Name)"
            }
          }

          if ($failed) { exit 1 }

      - name: Reject known PowerShell 7-only operator APIs
        shell: powershell
        run: |
          $patterns = @(
            '(?i)-Encoding\s+utf8NoBOM',
            '\[Convert\]::ToHexString\s*\(',
            'RandomNumberGenerator\]::Fill\s*\('
          )

          $files = Get-ChildItem "infra/omniroute" -Filter "*.ps1" -File -Recurse
          $hits = foreach ($file in $files) {
            $text = Get-Content -Raw $file.FullName
            foreach ($pattern in $patterns) {
              if ($text -match $pattern) {
                "$($file.FullName): $pattern"
              }
            }
          }

          if ($hits) {
            $hits | ForEach-Object { Write-Error "PowerShell 7-only API detected in Windows operator script: $_" }
            exit 1
          }

          Write-Host "No known PowerShell 7-only APIs found in OmniRoute operator scripts."

      - name: Confirm no credential-shaped literal is committed
        shell: powershell
        run: |
          $patterns = @(
            'sk-[A-Za-z0-9_-]{20,}',
            'nvapi-[A-Za-z0-9_-]{20,}',
            '-----BEGIN [A-Z ]*PRIVATE KEY-----',
            '(?i)OMNIROUTE_API_KEY\s*=\s*[^<\s][^\s]{12,}'
          )

          $files = Get-ChildItem "infra/omniroute" -File -Recurse
          $hits = foreach ($file in $files) {
            $text = Get-Content -Raw $file.FullName
            foreach ($pattern in $patterns) {
              if ($text -match $pattern) {
                "$($file.FullName): $pattern"
              }
            }
          }

          if ($hits) {
            $hits | ForEach-Object { Write-Error "Credential-shaped literal detected: $_" }
            exit 1
          }

          Write-Host "No credential-shaped literal found under infra/omniroute."

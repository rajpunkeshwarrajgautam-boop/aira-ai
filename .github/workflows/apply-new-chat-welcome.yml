name: Apply new-chat welcome UX

on:
  push:
    branches:
      - fix/new-chat-welcome

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/new-chat-welcome
          fetch-depth: 0

      - name: Patch signed-in landing behavior
        shell: python
        run: |
          from pathlib import Path

          search_layout = Path('perplexity-clone/my-turborepo/apps/web/components/SearchLayout.tsx')
          text = search_layout.read_text()

          old = '''\t\tsetConversations(rows.conversations);\n\t\tsetSelectedConversationId((prev) => prev ?? (rows.conversations[0]?.id ?? null));\n\t\tsetSelectedConversationTitle(rows.conversations[0]?.title ?? null);'''
          new = '''\t\tsetConversations(rows.conversations);\n\t\tsetSelectedConversationId((prev) =>\n\t\t\tprev && rows.conversations.some((conversation) => conversation.id === prev)\n\t\t\t\t? prev\n\t\t\t\t: null,\n\t\t);'''
          if old not in text:
              raise SystemExit('fetchConversations target not found')
          text = text.replace(old, new, 1)

          old = '''\tconst onCreateConversation = useCallback(async () => {\n\t\tif (busy) return;\n\t\tif (sessionStatus !== "authenticated") {\n\t\t\trouter.push(`/signin?callbackUrl=${encodeURIComponent("/")}`);\n\t\t\treturn;\n\t\t}\n\t\tsetStreamingUserQuery(null);\n\t\tsetStreamingAssistantMarkdown(null);\n\t\tsetStreamingCitations([]);\n\t\tsetErrorMessage(null);\n\t\tsetPhase("idle");\n\t\tawait createConversation();\n\t}, [busy, createConversation, router, sessionStatus]);'''
          new = '''\tconst onCreateConversation = useCallback(async () => {\n\t\tif (busy) return;\n\t\tif (sessionStatus !== "authenticated") {\n\t\t\trouter.push(`/signin?callbackUrl=${encodeURIComponent("/")}`);\n\t\t\treturn;\n\t\t}\n\t\tabortRef.current?.abort();\n\t\tsetSelectedConversationId(null);\n\t\tsetSelectedConversationTitle(null);\n\t\tsetMessages([]);\n\t\tsetParentMessageId(undefined);\n\t\tsetResearchHistory([]);\n\t\tsetShareContext(null);\n\t\tsetStreamingUserQuery(null);\n\t\tsetStreamingAssistantMarkdown(null);\n\t\tsetStreamingCitations([]);\n\t\tsetQuery("");\n\t\tsetErrorMessage(null);\n\t\tsetErrorCode(null);\n\t\tsetLimitErrorAction(null);\n\t\tsetResearchMode("standard");\n\t\tsetPhase("idle");\n\t\trequestAnimationFrame(() => searchBoxRef.current?.focus());\n\t}, [busy, router, sessionStatus]);'''
          if old not in text:
              raise SystemExit('onCreateConversation target not found')
          text = text.replace(old, new, 1)

          text = text.replace('? "AiraAI"\n', '? "Welcome to AiraAI"\n', 1)
          text = text.replace(
              '? "Persistent research threads with live web citations. Switch to Deep Research for comprehensive reports."',
              '? "Start a fresh conversation. Saved memory can still help when relevant, while previous chats stay in the sidebar."',
              1,
          )
          search_layout.write_text(text)

          message_list = Path('perplexity-clone/my-turborepo/apps/web/components/conversations/ConversationMessageList.tsx')
          message_text = message_list.read_text()
          message_text = message_text.replace('>Continue your research</h2>', '>Previous conversations</h2>', 1)
          message_text = message_text.replace('>Pick up where you left off.</p>', '>Open one only when you want to continue it.</p>', 1)
          message_text = message_text.replace('isAuthed ? "Or start with an example" : "Try an example"', 'isAuthed ? "Start a new chat with an example" : "Try an example"', 1)
          message_list.write_text(message_text)

      - name: Remove one-time workflow and commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-new-chat-welcome.yml
          git add perplexity-clone/my-turborepo/apps/web/components/SearchLayout.tsx
          git add perplexity-clone/my-turborepo/apps/web/components/conversations/ConversationMessageList.tsx
          git commit -m "Open signed-in users on a fresh chat welcome"
          git push origin HEAD:fix/new-chat-welcome

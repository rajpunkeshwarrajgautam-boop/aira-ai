name: Agent Scheduler CI

on:
  pull_request:
    paths:
      - "infra/agent-scheduler/**"
      - "perplexity-clone/my-turborepo/apps/web/lib/agent-platform/scheduler.ts"
      - "perplexity-clone/my-turborepo/apps/web/lib/agent-platform/orchestrator.ts"
      - "perplexity-clone/my-turborepo/apps/web/lib/agent-platform/approval-expiry.ts"
      - "perplexity-clone/my-turborepo/apps/web/lib/tool-gateway/approval.ts"
      - "perplexity-clone/my-turborepo/apps/web/lib/tool-gateway/store.ts"
      - "perplexity-clone/my-turborepo/apps/web/app/api/internal/tool-gateway/**"
      - "perplexity-clone/my-turborepo/apps/web/lib/billing/plan-enforcement.ts"
      - "perplexity-clone/my-turborepo/apps/web/app/api/agent-platform/approvals/**"
      - "perplexity-clone/my-turborepo/apps/web/app/api/internal/agent-platform/tick/**"
      - ".github/workflows/agent-scheduler-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/agent-scheduler/**"
      - "perplexity-clone/my-turborepo/apps/web/lib/agent-platform/scheduler.ts"
      - "perplexity-clone/my-turborepo/apps/web/lib/agent-platform/orchestrator.ts"
      - "perplexity-clone/my-turborepo/apps/web/lib/agent-platform/approval-expiry.ts"
      - "perplexity-clone/my-turborepo/apps/web/lib/tool-gateway/approval.ts"
      - "perplexity-clone/my-turborepo/apps/web/lib/tool-gateway/store.ts"
      - "perplexity-clone/my-turborepo/apps/web/app/api/internal/tool-gateway/**"
      - "perplexity-clone/my-turborepo/apps/web/lib/billing/plan-enforcement.ts"
      - "perplexity-clone/my-turborepo/apps/web/app/api/agent-platform/approvals/**"
      - "perplexity-clone/my-turborepo/apps/web/app/api/internal/agent-platform/tick/**"
      - ".github/workflows/agent-scheduler-ci.yml"

permissions:
  contents: read

jobs:
  agent-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIRA_SCHEDULER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scheduler source
        run: python -m py_compile infra/agent-scheduler/worker.py infra/agent-scheduler/test_leases.py infra/agent-scheduler/test_managed_quota.py infra/agent-scheduler/test_approvals.py infra/agent-scheduler/test_tool_gateway.py infra/agent-scheduler/test_tool_authorization.py

      - name: Install scheduler test dependency
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<3.3"

      - name: Prove concurrent database lease quota approval Tool Gateway and authorization semantics
        working-directory: infra/agent-scheduler
        run: python -m unittest -v test_leases.py test_managed_quota.py test_approvals.py test_tool_gateway.py test_tool_authorization.py

      - name: Validate Compose profile
        env:
          AIRA_AGENT_SCHEDULER_WEB_URL: https://aira.example.test
          AIRA_AGENT_SCHEDULER_TOKEN: contract-scheduler-token-contract
        working-directory: infra/agent-scheduler
        run: docker compose -f compose.yml config --quiet

      - name: Confirm scheduler is non-privileged
        run: |
          grep -q 'cap_drop: \["ALL"\]' infra/agent-scheduler/compose.yml
          grep -q 'no-new-privileges:true' infra/agent-scheduler/compose.yml
          grep -q 'read_only: true' infra/agent-scheduler/compose.yml
          if grep -RnE '(privileged:[[:space:]]*true|/var/run/docker.sock)' infra/agent-scheduler; then
            echo "::error::Unsafe scheduler configuration detected."
            exit 1
          fi

      - name: Build scheduler image
        run: docker build -t aira-agent-scheduler:ci infra/agent-scheduler

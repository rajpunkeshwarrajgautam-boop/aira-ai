name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm run ci

  autogpt-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/autogpt-runner/adapter/requirements.txt

      - name: Install adapter dependencies
        run: pip install -r infra/autogpt-runner/adapter/requirements.txt

      - name: Run adapter contract tests
        run: python -m unittest infra/autogpt-runner/tests/test_adapter.py

      - name: Validate deployment profiles
        working-directory: infra/autogpt-runner
        env:
          RUNNER_API_KEY: contract-runner-key-contract-runner-key
          AUTOGPT_INTERNAL_TOKEN: sk-contract-internal-token-contract-internal
          NVIDIA_API_KEY: contract-nvidia-key-contract-nvidia-key
          RUNNER_DOMAIN: autogpt-primary.example.com
          CLOUDFLARE_TUNNEL_TOKEN: contract-cloudflare-tunnel-token
        run: |
          docker compose -f compose.yml -f compose.vps.yml config --quiet
          docker compose -f compose.yml -f compose.windows.yml config --quiet

      - name: Build authenticated adapter image
        run: docker build -t aira-autogpt-adapter:ci infra/autogpt-runner/adapter

  foundation-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRA_CONTROL_PLANE_TOKEN: contract-control-plane-token-contract
      AIRA_KNOWLEDGE_WORKER_TOKEN: contract-worker-token-contract
      AIRA_SANDBOX_TOKEN: contract-sandbox-token-contract
      AIRA_CONTROL_PLANE_URL: http://127.0.0.1:8090
      AIRA_SANDBOX_URL: http://127.0.0.1:8091
      AIRA_INFERENCE_IMAGE: example.invalid/aira-inference:ci
      AIRA_INFERENCE_MODEL: ci-model
      AIRA_INFERENCE_API_KEY: contract-inference-key-contract
      ADMISSION_SEARCH_LIMIT: "2"
      ADMISSION_DEEP_LIMIT: "2"
      ADMISSION_AGENT_LIMIT: "2"
      QUEUE_MAX_DEPTH: "10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python and shell contracts
        run: |
          python -m py_compile \
            infra/foundation/control-plane/app.py \
            infra/foundation/knowledge-worker/worker.py \
            infra/foundation/sandbox/server.py \
            infra/foundation/sandbox-gateway/server.py \
            infra/foundation/scripts/autogpt_preflight.py \
            infra/foundation/training/validate_dataset.py \
            infra/foundation/training/pipeline.py \
            infra/foundation/training/validate_synthetic_provenance.py \
            infra/foundation/gpu/health_agent.py \
            infra/foundation/autonomy/task_policy.py \
            infra/foundation/crypto/pqc_readiness.py \
            infra/foundation/tests/smoke.py
          python infra/foundation/training/validate_dataset.py --self-test
          python infra/foundation/training/validate_synthetic_provenance.py --self-test
          python infra/foundation/gpu/health_agent.py --fixture infra/foundation/gpu/health-fixture.json
          python infra/foundation/autonomy/task_policy.py infra/foundation/autonomy/request-ci.json --policy infra/foundation/autonomy/policy.example.json
          python infra/foundation/crypto/pqc_readiness.py
          bash -n infra/foundation/gpu/validate_fabric.sh

      - name: Validate foundation Compose profiles
        working-directory: infra/foundation
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.yml -f compose.gvisor.yml config --quiet

      - name: Build foundation service images
        run: |
          docker build -t aira-foundation-control:ci infra/foundation/control-plane
          docker build -t aira-foundation-ingestion:ci infra/foundation/knowledge-worker
          docker build -t aira-foundation-sandbox:ci infra/foundation/sandbox
          docker build -t aira-foundation-sandbox-gateway:ci infra/foundation/sandbox-gateway

      - name: Start control plane and sandbox gateway
        working-directory: infra/foundation
        run: docker compose -f compose.yml up -d --build redis control-plane sandbox sandbox-gateway

      - name: Verify distributed control and sandbox isolation
        run: python infra/foundation/tests/smoke.py

      - name: Stop foundation smoke services
        if: always()
        working-directory: infra/foundation
        run: docker compose -f compose.yml down -v --remove-orphans

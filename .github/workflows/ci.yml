name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/lock-down-data-api

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit refreshed lockfile on security branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/agent/lock-down-data-api' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "Refresh pnpm lockfile after security upgrades"
          git push

      - name: Run quality gates
        run: pnpm run ci

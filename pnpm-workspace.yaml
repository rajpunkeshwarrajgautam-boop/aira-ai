packages:
  - "perplexity-clone/my-turborepo/apps/*"
  - "perplexity-clone/my-turborepo/packages/*"

overrides:
  '@auth/core': 0.41.3
  fast-uri: 3.1.5
  find-my-way: 9.7.0
  form-data: 4.0.6
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.0
  valibot: 1.4.2

# Temporary, narrowly scoped exception for an upstream-only production audit
# finding. Prisma 7.9.1 -> @prisma/config 7.9.1 pins deepmerge-ts 7.1.5,
# while GHSA-ggr8-5vv4-36mx requires deepmerge-ts >=8.0.0 and no 8.x stable
# package is currently available. Remove this entry as soon as Prisma or
# deepmerge-ts publishes a compatible patched release. All other advisories
# continue to fail `pnpm audit --prod`.
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - sharp

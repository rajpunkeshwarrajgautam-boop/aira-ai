name: aira-autogpt

services:
  adapter:
    build:
      context: ./adapter
    restart: unless-stopped
    environment:
      RUNNER_API_KEY: ${RUNNER_API_KEY:?RUNNER_API_KEY is required}
      AUTOGPT_INTERNAL_TOKEN: ${AUTOGPT_INTERNAL_TOKEN:?AUTOGPT_INTERNAL_TOKEN is required}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?NVIDIA_API_KEY is required}
      AUTOGPT_INTERNAL_URL: http://autogpt:8000/ap/v1
      RUNNER_DATABASE_PATH: /data/runner.db
      AIRA_GRAPH_ID: ${AIRA_GRAPH_ID:-aira-objective-runner}
      AIRA_GRAPH_VERSION: ${AIRA_GRAPH_VERSION:-1}
      AUTOGPT_MAX_STEPS: ${AUTOGPT_MAX_STEPS:-12}
      AUTOGPT_MAX_CONCURRENT_RUNS: ${AUTOGPT_MAX_CONCURRENT_RUNS:-1}
      AUTOGPT_UPSTREAM_TIMEOUT_SECONDS: ${AUTOGPT_UPSTREAM_TIMEOUT_SECONDS:-180}
      NVIDIA_API_URL: ${NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_SMART_MODEL: ${NVIDIA_SMART_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
      NVIDIA_FAST_MODEL: ${NVIDIA_FAST_MODEL:-nvidia/nemotron-3-nano-30b-a3b}
      NVIDIA_EMBEDDING_MODEL: ${NVIDIA_EMBEDDING_MODEL:-nvidia/nv-embedqa-e5-v5}
    volumes:
      - adapter-data:/data
    networks:
      - agent-internal
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/internal-ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  autogpt:
    build:
      context: .
      dockerfile: Dockerfile.autogpt
      args:
        AUTOGPT_COMMIT: ${AUTOGPT_COMMIT:-601093ddfe23a3d58a9c8f4a208bd49b203ee612}
    restart: unless-stopped
    depends_on:
      adapter:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${AUTOGPT_INTERNAL_TOKEN:?AUTOGPT_INTERNAL_TOKEN is required}
      OPENAI_API_BASE_URL: http://adapter:8080/internal/v1
      SMART_LLM: gpt-4o
      FAST_LLM: gpt-4o-mini
      EMBEDDING_MODEL: text-embedding-3-small
      AP_SERVER_PORT: "8000"
      NONINTERACTIVE_MODE: "True"
      RESTRICT_TO_WORKSPACE: "True"
      EXECUTE_LOCAL_COMMANDS: "False"
      AUTHORISE_COMMAND_KEY: y
      LOG_LEVEL: INFO
      DISABLED_COMMANDS: execute_python_code,execute_python_file,execute_shell,execute_shell_popen,git_status,git_add,git_commit,git_push,git_pull,git_diff,git_branch,git_checkout,git_log,web_search,search_and_extract,fetch_webpage,fetch_raw_html,read_webpage,take_screenshot,click_element,fill_form,http_get,http_post,http_put,http_delete,read_file,write_file,list_folder,append_to_file,copy_file,move_file,delete_file,search_in_files,get_file_info,create_archive,extract_archive,list_archive,search_blocks,execute_block,find_agent,run_agent,get_agent_result,list_skills,load_skill,unload_skill,read_skill_file
    volumes:
      - autogpt-workspace:/workspace
    networks:
      - agent-internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  adapter-data:
  autogpt-workspace:

networks:
  agent-internal:
    internal: true
  edge:
    driver: bridge

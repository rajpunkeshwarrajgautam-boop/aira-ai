name: aira-edge

# The single TLS terminator in front of every Vercel-facing AIRA runtime
# service. It uses the host network so it can reach the loopback ports that
# runtime services publish without exposing those workers directly.

services:
  edge:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      AIRA_ACME_EMAIL: ${AIRA_ACME_EMAIL:?set AIRA_ACME_EMAIL}
      AIRA_CONTROL_HOST: ${AIRA_CONTROL_HOST:?set AIRA_CONTROL_HOST}
      AIRA_CONTROL_PORT: ${AIRA_CONTROL_PLANE_PORT:-8090}
      AIRA_SANDBOX_HOST: ${AIRA_SANDBOX_HOST:?set AIRA_SANDBOX_HOST}
      AIRA_SANDBOX_PORT: ${AIRA_SANDBOX_PORT:-8091}
      AIRA_BROWSER_HOST: ${AIRA_BROWSER_HOST:?set AIRA_BROWSER_HOST}
      AIRA_BROWSER_PORT: ${AIRA_BROWSER_PORT:-8092}
      AIRA_DEERFLOW_HOST: ${AIRA_DEERFLOW_HOST:?set AIRA_DEERFLOW_HOST}
      AIRA_DEERFLOW_PORT: ${AIRA_DEERFLOW_PORT:-2026}
      AIRA_AUTOGPT_PRIMARY_HOST: ${AIRA_AUTOGPT_PRIMARY_HOST:?set AIRA_AUTOGPT_PRIMARY_HOST}
      AIRA_AUTOGPT_PRIMARY_PORT: ${AIRA_AUTOGPT_PRIMARY_PORT:-8096}
      AIRA_AUTOGPT_SECONDARY_HOST: ${AIRA_AUTOGPT_SECONDARY_HOST:?set AIRA_AUTOGPT_SECONDARY_HOST}
      AIRA_AUTOGPT_SECONDARY_PORT: ${AIRA_AUTOGPT_SECONDARY_PORT:-8097}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
      - edge-config:/config
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  edge-data:
  edge-config:

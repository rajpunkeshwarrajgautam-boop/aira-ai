name: aira-browser-worker

services:
  browser-worker:
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      AIRA_BROWSER_RUNTIME_TOKEN: ${AIRA_BROWSER_RUNTIME_TOKEN:?set AIRA_BROWSER_RUNTIME_TOKEN}
      AIRA_BROWSER_MAX_SESSIONS: ${AIRA_BROWSER_MAX_SESSIONS:-6}
      AIRA_BROWSER_SESSION_TTL_SECONDS: ${AIRA_BROWSER_SESSION_TTL_SECONDS:-3600}
    ports:
      - "127.0.0.1:${AIRA_BROWSER_PORT:-8092}:8080"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 384
    shm_size: "1gb"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

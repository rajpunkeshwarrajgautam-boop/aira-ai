name: aira-terminal-worker

services:
  terminal-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${AIRA_TERMINAL_PORT:-8093}:8080"
    environment:
      AIRA_TERMINAL_RUNTIME_TOKEN: ${AIRA_TERMINAL_RUNTIME_TOKEN:?set AIRA_TERMINAL_RUNTIME_TOKEN}
      AIRA_TERMINAL_MAX_WORKSPACES: ${AIRA_TERMINAL_MAX_WORKSPACES:-16}
      AIRA_TERMINAL_COMMAND_TIMEOUT_SECONDS: ${AIRA_TERMINAL_COMMAND_TIMEOUT_SECONDS:-180}
      AIRA_TERMINAL_MAX_OUTPUT_BYTES: ${AIRA_TERMINAL_MAX_OUTPUT_BYTES:-1048576}
      AIRA_TERMINAL_ALLOWED_GIT_HOSTS: ${AIRA_TERMINAL_ALLOWED_GIT_HOSTS:-github.com}
      AIRA_TERMINAL_ALLOWED_EXECUTABLES: ${AIRA_TERMINAL_ALLOWED_EXECUTABLES:-git,node,npm,npx,pnpm,python,python3,pytest,tsc,eslint}
      AIRA_TERMINAL_GIT_AUTH_HEADER: ${AIRA_TERMINAL_GIT_AUTH_HEADER:-}
      AIRA_TERMINAL_GIT_AUTHOR_NAME: ${AIRA_TERMINAL_GIT_AUTHOR_NAME:-AIRA Agent}
      AIRA_TERMINAL_GIT_AUTHOR_EMAIL: ${AIRA_TERMINAL_GIT_AUTHOR_EMAIL:-aira-agent@localhost}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - terminal-workspaces:/workspaces
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  terminal-workspaces:
